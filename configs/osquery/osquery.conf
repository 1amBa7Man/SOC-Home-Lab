{
  "options": {
    "config_plugin": "filesystem",
    "logger_plugin": "filesystem",
    "logger_path": "C:\\Program Files\\osquery\\log",
    "disable_logging": "false",
    "log_result_events": "true",
    "schedule_splay_percent": "10",
    "pidfile": "C:\\Program Files\\osquery\\osquery.pidfile",
    "events_expiry": "3600",
    "database_path": "C:\\Program Files\\osquery\\osquery.db"
  },
  "schedule": {
    "processes_snapshot": {
      "query": "SELECT pid, name, path, cmdline, parent, uid FROM processes;",
      "interval": 60,
      "description": "Snapshot of running processes for baseline / anomaly comparison"
    },
    "listening_ports": {
      "query": "SELECT pid, port, protocol, address, path FROM listening_ports;",
      "interval": 120,
      "description": "Catches unexpected services listening on the endpoint"
    },
    "scheduled_tasks_check": {
      "query": "SELECT name, action, path, enabled FROM scheduled_tasks WHERE enabled = 1;",
      "interval": 300,
      "description": "Detects new/suspicious scheduled tasks used for persistence (T1053.005)"
    },
    "startup_items": {
      "query": "SELECT name, path, source FROM startup_items;",
      "interval": 300,
      "description": "Detects persistence via Run keys / Startup folder"
    },
    "logged_in_users_check": {
      "query": "SELECT user, host, time, type FROM logged_in_users;",
      "interval": 60,
      "description": "Tracks active/remote logon sessions"
    },
    "usb_devices_check": {
      "query": "SELECT vendor, model, serial FROM usb_devices;",
      "interval": 300,
      "description": "Flags removable media insertion — data exfiltration vector"
    },
    "autoexec_check": {
      "query": "SELECT name, path, source FROM autoexec;",
      "interval": 600,
      "description": "Broad autorun/autoexec locations — DLL search order hijack, persistence"
    }
  }
}
